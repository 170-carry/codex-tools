name: Release Tauri App

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:pages
      - run: npm run build
      - name: Rust regression tests
        run: cargo test --locked --lib
        working-directory: src-tauri
      - name: Packaged standalone proxy check
        run: cargo check --locked --manifest-path gen/remote-build/proxyd/Cargo.toml --target-dir proxyd/target
        working-directory: src-tauri

  build-and-release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "macos-latest"
            args: "--target aarch64-apple-darwin"
            bundle_nickname: "macOS Apple Silicon"
          - runner: "macos-15-intel"
            args: "--target x86_64-apple-darwin"
            bundle_nickname: "macOS Intel"
          - runner: "windows-latest"
            args: ""
            bundle_nickname: "Windows"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare optional bilingual release notes / 准备可选双语更新说明
        id: release_notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: node scripts/extract-release-notes.mjs "$RELEASE_TAG" --github-output

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          releaseName: "Codex Tools ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  publish-npm-native:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: validate
    name: Publish npm native package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "macos-latest"
            target: "aarch64-apple-darwin"
            package_dir: "ctc-darwin-arm64"
            binary_name: "codex-tools-cli"
          - runner: "macos-15-intel"
            target: "x86_64-apple-darwin"
            package_dir: "ctc-darwin-x64"
            binary_name: "codex-tools-cli"
          - runner: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            package_dir: "ctc-win32-x64"
            binary_name: "codex-tools-cli.exe"
    runs-on: ${{ matrix.runner }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm publication identity
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm whoami --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Sync npm package versions
        run: node scripts/sync-npm-package-version.mjs

      - name: Build native CLI
        run: cargo build --release --bin codex-tools-cli --target ${{ matrix.target }}
        working-directory: src-tauri

      - name: Prepare npm native package
        run: node scripts/prepare-npm-native-package.mjs "npm/${{ matrix.package_dir }}" "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "${{ matrix.binary_name }}"

      - name: Publish npm native package
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish "./npm/${{ matrix.package_dir }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Skip npm native publish
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not configured; skipping npm native package publish."

  publish-npm-wrapper:
    name: Publish npm wrapper package
    needs: publish-npm-native
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Sync npm package versions
        run: node scripts/sync-npm-package-version.mjs

      - name: Publish npm wrapper package
        if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish ./npm/ctc --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Skip npm wrapper publish
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not configured; skipping npm wrapper package publish."
