name: Build Git Calendar for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: git-calendar-windows-x64
      - name: Install dependencies
        run: npm ci
      - name: Check source
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:pages
          exit $LASTEXITCODE
      - name: Test Git collector
        working-directory: src-tauri
        run: cargo test --locked --bin git-calendar
      - name: Build installer
        run: npm run tauri -- build --ci --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.git-activity.conf.json
      - name: Prepare downloads
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -eq 0) { throw 'Installer was not generated' }
          New-Item -ItemType Directory -Path windows-downloads -Force | Out-Null
          foreach ($installer in $installers) {
            Copy-Item -LiteralPath $installer.FullName -Destination windows-downloads
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
            "$hash  $($installer.Name)" | Add-Content windows-downloads/SHA256SUMS.txt
          }
          "Windows x64 installer built from $env:GITHUB_SHA. This build is not code-signed." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: CodexTools-Git-Windows-x64
          path: windows-downloads/
          if-no-files-found: error
          retention-days: 14
